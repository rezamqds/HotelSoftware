{% extends "base.html" %}

{% block content %}
<h1>ویرایش اتاق {{ room.room_number }}</h1>

<form action="/rooms/{{ room.id }}/edit" method="POST" style="max-width: 500px; margin: 0 auto;">
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">شماره اتاق: *</label>
        <input type="text" name="room_number" value="{{ room.room_number }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">نوع اتاق: *</label>
        <select name="room_type" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="تک نفره" {% if room.room_type == 'تک نفره' %}selected{% endif %}>تک نفره</option>
            <option value="دو نفره" {% if room.room_type == 'دو نفره' %}selected{% endif %}>دو نفره</option>
            <option value="سوئیت" {% if room.room_type == 'سوئیت' %}selected{% endif %}>سوئیت</option>
            <option value="خانوادگی" {% if room.room_type == 'خانوادگی' %}selected{% endif %}>خانوادگی</option>
            <option value="لوکس" {% if room.room_type == 'لوکس' %}selected{% endif %}>لوکس</option>
        </select>
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">ظرفیت: *</label>
        <input type="number" name="capacity" value="{{ room.capacity }}" required min="1" max="10" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">قیمت هر شب (تومان): *</label>
        <input type="number" name="price_per_night" value="{{ room.price_per_night }}" required min="0" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">
            <input type="checkbox" name="is_available" value="1" {% if room.is_available %}checked{% endif %}>
            قابل رزرو
        </label>
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">توضیحات:</label>
        <textarea name="description" rows="3" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">{{ room.description or '' }}</textarea>
    </div>

    <div>
        <button type="submit" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">ذخیره تغییرات</button>
        <a href="/rooms" style="color: #000; margin-right: 20px;">انصراف</a>
    </div>
</form>
{% endblock %}
